<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プライバシーポリシー一覧 / Privacy Policies</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>

<div class="legal-page">

<div class="lang-switch">
  <button onclick="switchLang()">English / 日本語</button>
</div>

<a href="../" class="legal-page__back">&larr; <span data-lang-ja>トップに戻る</span><span data-lang-en>Back to Home</span></a>

<!-- Japanese -->
<div data-lang-ja>
<h1>プライバシーポリシー一覧</h1>
<ul id="policy-list-ja" class="policy-list mt-lg"></ul>
</div>

<!-- English -->
<div data-lang-en>
<h1>Privacy Policies</h1>
<ul id="policy-list-en" class="policy-list mt-lg"></ul>
</div>

</div>

<footer class="site-footer">
  <p>&copy; 2026 sak1361. All rights reserved.</p>
</footer>

<script src="../assets/js/common.js"></script>
<script>
function renderList(apps, lang) {
  const list = document.getElementById(`policy-list-${lang}`);
  const items = apps.filter(a => a.released && a.has_privacy_policy);

  if (items.length === 0) {
    list.innerHTML = `<li class="app-grid__status">${lang === 'ja' ? 'まだポリシーがありません' : 'No policies available yet'}</li>`;
    return;
  }

  list.innerHTML = items.map(app => {
    const name = lang === 'ja' ? app.name_ja : app.name_en;
    const emoji = APP_ICON_MAP[app.icon] || '📱';
    return `
      <li>
        <a href="./${app.id}/">
          <span class="policy-list__icon" style="background:${app.color}">${emoji}</span>
          <span class="policy-list__name">${name}</span>
          <span class="policy-list__arrow">&rsaquo;</span>
        </a>
      </li>
    `;
  }).join('');
}

(async function() {
  setLang(detectLang());
  try {
    const apps = await fetchApps('../');
    renderList(apps, 'ja');
    renderList(apps, 'en');
  } catch (e) {
    document.getElementById('policy-list-ja').innerHTML = '<li>読み込みに失敗しました</li>';
    document.getElementById('policy-list-en').innerHTML = '<li>Failed to load</li>';
  }
})();
</script>

</body>
</html>
