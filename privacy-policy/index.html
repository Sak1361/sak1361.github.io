<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プライバシーポリシー一覧 / Privacy Policies</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>

<div style="max-width:780px;margin:0 auto;padding:0 8px;">

<div class="lang-switch" style="margin-top:8px;">
  <button onclick="switchLang()">English / 日本語</button>
</div>

<!-- Japanese -->
<div data-lang-ja>

<div class="section__title">■ プライバシーポリシー一覧</div>

<div style="font-size:12px;color:#666;margin:8px 0;">[<a href="../">トップに戻る</a>]</div>

<ul id="policy-list-ja" class="policy-list"></ul>

</div>

<!-- English -->
<div data-lang-en>

<div class="section__title">■ Privacy Policies</div>

<div style="font-size:12px;color:#666;margin:8px 0;">[<a href="../">Back to Home</a>]</div>

<ul id="policy-list-en" class="policy-list"></ul>

</div>

</div>

<footer class="site-footer">
  <p>&copy; 2026 sak1361. All rights reserved.</p>
</footer>

<script src="../assets/js/common.js"></script>
<script>
function renderList(apps, lang) {
  const list = document.getElementById(`policy-list-${lang}`);
  const items = apps.filter(a => a.released && a.has_privacy_policy);

  if (items.length === 0) {
    list.innerHTML = `<li class="app-grid__status">${lang === 'ja' ? 'まだポリシーがありません' : 'No policies available yet'}</li>`;
    return;
  }

  const now = new Date();
  const days = lang === 'ja'
    ? ['日','月','火','水','木','金','土']
    : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}(${days[now.getDay()]})`;
  const sep = lang === 'ja' ? '：' : ':';

  list.innerHTML = items.map((app, i) => {
    const name = lang === 'ja' ? app.name_ja : app.name_en;
    const desc = lang === 'ja' ? app.description_ja : app.description_en;
    const iconHtml = app.icon_url
      ? `<img class="policy-list__icon policy-list__icon--img" src="../${app.icon_url}" alt="${name}" width="40" height="40">`
      : `<span class="policy-list__icon" style="background:${app.color}">${APP_ICON_MAP[app.icon] || ''}</span>`;
    return `
      <li>
        <a href="./${app.id}/">
          ${iconHtml}
          <span class="policy-list__name">${name}<br><span style="font-weight:normal;font-size:12px;color:#666;">${desc}</span></span>
          <span class="policy-list__arrow">&rsaquo;</span>
        </a>
      </li>
    `;
  }).join('');
}

(async function() {
  setLang(detectLang());
  try {
    const apps = await fetchApps('../');
    renderList(apps, 'ja');
    renderList(apps, 'en');
  } catch (e) {
    document.getElementById('policy-list-ja').innerHTML = '<li>読み込みに失敗しました</li>';
    document.getElementById('policy-list-en').innerHTML = '<li>Failed to load</li>';
  }
})();
</script>

</body>
</html>
